<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Simulation Covid</title>
</head>
<body>
  <h1>Création d'utilisateur</h1>
  <form id="userForm" onsubmit="event.preventDefault(); sendUser();">
    <label>Nom :</label>
    <input id="name" required><br>
    <label>Âge :</label>
    <input id="age" type="number" required><br>
    <button type="submit">Créer</button>
  </form>

  <div id="userInfo" style="display:none;">
    <h2>Profil</h2>
    <p id="display"></p>
    <button id="checkBtn">Vérifier si contaminé</button>
    <p id="status"></p>
  </div>

  <script src="/js/script.js"></script>
</body>
</html>
